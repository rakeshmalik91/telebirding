<html>

<head>
	<title>Telebirding Admin</title>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

	<link rel="icon" type="image/png" href="icons/favicon-admin-48x48.png">
	<link rel="shortcut icon" type="image/x-icon" href="icons/favicon-16x16.png">
	<link rel="apple-touch-icon" href="icons/favicon-64x64.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" charset="UTF-8" href="css/animations.css?v=20260318">
	<link rel="stylesheet" charset="UTF-8" href="css/admin.css?v=20260826-1226">
	<link rel="stylesheet" charset="UTF-8" href="css/searchable-select.css?v=20260826-1226">
	<link rel="stylesheet" charset="UTF-8" href="css/cropper-custom.css?v=20260318">

	<script type="text/javascript" charset="UTF-8" src="lib/js/jquery.min.js"></script>

	<!-- Firebase Scripts -->
	<script type="module" src="scripts/modules/admin/rendering.js?v=20260826-1226"></script>

	<script type="text/javascript" charset="UTF-8" src="lib/js/moment.min.js"></script>



	<!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" /> -->
	<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script> -->
	<link rel="stylesheet" href="lib/css/cropper.min.css" />
	<script src="lib/js/cropper.min.js"></script>

	<!-- <script src="https://cdn.jsdelivr.net/npm/exif-js"></script> -->
	<script src="lib/js/exif.js"></script>

	<!-- <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase.js"></script> -->
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
	<script type="module" src="scripts/admin.js?v=20260826-1226"></script>

</head>

<body>
	<div id="login-page" class="admin-card login-card">
		<a href="/" class='site-logo'></a>
		<h1>Admin</h1>
		<table>
			<tr>
				<td><span>Email:</span></td>
				<td><input type="text" name="email" value="rakeshmalik91@gmail.com" disabled /></td>
			</tr>
			<tr>
				<td><span>Password:</span></td>
				<td><input type="password" name="password" /></td>
			</tr>
			<tr>
				<td></td>
				<td><input type="checkbox" name="rememberme" />Remember me</td>
			</tr>
			<tr>
				<td></td>
				<td><button>Log in</button></td>
			</tr>
		</table>
	</div>
	<div class='data' style='display: none;'>
		<div class="admin-header admin-card">
			<a href="/" class='site-logo'></a>
			<h1>Admin</h1>
			<button class="logout">Log Out</button>
			<div class="mode-tabs">
				<button class="mode-tab" data-mode="bird">BIRD</button>
				<button class="mode-tab" data-mode="insect">INSECT</button>
			</div>
		</div>

		<br>


		<div class="admin-nav-tabs">
			<button class="admin-nav-tab active" data-tab="sightings-tab">Sightings</button>
			<button class="admin-nav-tab" data-tab="species-tab">Species</button>
			<button class="admin-nav-tab" data-tab="family-tab">Family</button>
		</div>

		<div id="sightings-tab" class="admin-tab-content active">
			<div class="admin-card sightings-card">
				<h2>Add/Modify Sightings</h2>
			<div class='nav-top'>
				<button class='save' title='Save Now (Changes are auto-saved)' disabled>Save</button>
				<button class='undo' id='undo-btn' title='Undo last action' disabled>Undo</button>
				<button class='redo' id='redo-btn' title='Redo last action' disabled>Redo</button>
				<button class='add-sighting' title='Add new sighting'>Add New</button>
				<div class="right-actions" style="float: right; display: flex; align-items: center; gap: 5px;">
					<div class="sort-group">
						<button class='sort-by-date' title='Sort all data by date and save'>Sort</button>
						<button class='auto-sort-btn active' id='auto-sort-btn' title='Auto-sort when uploading media or saving'>Auto</button>
					</div>
					<button class='cleanup-media' title='Remove unreferenced media from storage'>Cleanup Media</button>
					<div class="btn-group">
						<button class='backup' title='Backup Data'>Backup</button>
						<button class="restore-backup" title="Restore Data from Backup">Restore</button>
					</div>
				</div>
				<br style="clear: both;">
				<div class="pagination-container" style="display: flex; align-items: center; width: 100%; box-sizing: border-box; padding-right: 10px; margin-top: 10px; margin-bottom: 15px;">
					
					<!-- Left-aligned pagination -->
					<div style="display: flex; align-items: center; gap: 10px; flex: 0 0 auto;">
						<div style="display: flex; align-items: center; gap: 5px;">
							<button class='first-page' title='First page' style="margin: 0 !important; width: 40px; padding: 8px 0; text-align: center;">&lt;&lt;</button>
							<button class='previous' title='Previous page' style="margin: 0 !important; width: 40px; padding: 8px 0; text-align: center;">&lt;</button>
						</div>
						<span class='page-number' style="font-weight: 500; margin: 0 !important; letter-spacing: 0.5px; text-align: center; display: inline-block;"></span>
						<div style="display: flex; align-items: center; gap: 5px;">
							<button class='next' title='Next page' style="margin: 0 !important; width: 40px; padding: 8px 0; text-align: center;">&gt;</button>
							<button class='last-page' title='Last page' style="margin: 0 !important; width: 40px; padding: 8px 0; text-align: center;">&gt;&gt;</button>
						</div>
					</div>
					
					<!-- Right side rows and filter -->
					<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex: 1;">
						<div class='input-clear-wrapper' style="width: 200px;">
							<input type="text" name="filter-sighting" placeholder="Filter" style="width: 100%; margin: 0 !important;" />
							<span class='input-clear-btn' title='Clear'>✕</span>
						</div>
						<div style="display: flex; align-items: center; gap: 8px;">
							<span class='text' style="margin: 0;">Rows: </span>
							<select name="page-size" style="margin: 0;">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="100">100</option>
								<option value="500">500</option>
							</select>
						</div>
					</div>
				</div>
			</div>
			<table id="sightings-table"></table>
			<div class='nav-bottom'>
				<div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
					<span>Watermark: </span>
					<label class="toggle-switch">
						<input type="checkbox" name="watermark-on" checked>
						<span class="toggle-slider"></span>
					</label>
					<input type="text" name="watermark" value="© ${author}">
					<input type="color" name="watermark-color" value="#ffffff">
				</div>
				<button class='first-page' title='First page'>&lt;&lt;</button>
				<button class='previous' title='Previous page'>&lt;</button>
				<span class='page-number'></span>
				<button class='next' title='Next page'>&gt;</button>
				<button class='last-page' title='Last page'>&gt;&gt;</button>
				<button class='save' title='Save Now (Changes are auto-saved)' disabled>Save</button>
			</div>
			</div>
		</div>
		
		<div id="species-tab" class="admin-tab-content">
			<div class="admin-card">
				<h2>Add/Modify Species</h2>
			<table id="update-species-form">
				<tr>
					<td>Name</td>
					<td><select data-field='name' data-tags='true' style="width: 100%; max-width: 700px;" placeholder="Select or type a species..."></select></td>
				</tr>
				<tr>
					<td>Family</td>
					<td><select data-field='family' style="width: 100%; max-width: 700px;" placeholder="Select or type a family..."></select></td>
				</tr>
				<tr>
					<td>Tags</td>
					<td>
			<div class="chip-input-container" style="width: 100%; max-width: 700px;">
				<div class="chips-wrapper"></div>
				<input type='text' class="chip-input" placeholder="Add tag..." />
				<input type='hidden' data-field='tags' />
			</div>
		</td>
				</tr>
				<tr>
					<td>Scientific Name</td>
					<td>
						<div class='input-clear-wrapper' style="width: 100%; max-width: 700px;">
							<input type='text' data-field='latin-name' placeholder="Scientific Name" style="width: 100%;" />
							<span class='input-clear-btn' title='Clear'>✕</span>
						</div>
					</td>
				</tr>
				<tr>
					<td>eBird Code</td>
					<td>
						<div class='input-clear-wrapper' style="width: 100%; max-width: 700px;">
							<input type='text' data-field='ebird-code' placeholder="eBird Code" style="width: 100%;" />
							<span class='input-clear-btn' title='Clear'>✕</span>
						</div>
					</td>
				</tr>
				<tr>
					<td>Sighting Count</td>
					<td>
						<span data-field='sighting-count' style="font-weight: bold; margin-left: 12px; padding: 8px 0; display: inline-block;">-</span>
					</td>
				</tr>
				<tr>
					<td class='noborder'>
						<button class='submit'>Add</button>
						<button class='delete' style='background-color: #d9534f;'>Delete</button>
					</td>
				</tr>
			</table>
			</div>
		</div>

		<div id="family-tab" class="admin-tab-content">
			<div id="add-family-section" class="admin-card" style="display:none;">
			<h2>Add/Modify Family</h2>
			<table id="add-family-form">
				<tr>
					<td>Name</td>
					<td>
						<select data-field='name' data-tags='true' style="width: 100%; max-width: 500px;" placeholder="Select or type a family..."></select>
					</td>
				</tr>
				<tr>
					<td>Scientific Name</td>
					<td>
						<div class='input-clear-wrapper' style="width: 100%; max-width: 500px;">
							<input type='text' data-field='sci-name' placeholder="Scientific Name" style="width: 100%;" />
							<span class='input-clear-btn' title='Clear'>✕</span>
						</div>
					</td>
				</tr>
				<tr>
					<td>eBird Code</td>
					<td>
						<div class='input-clear-wrapper' style="width: 100%; max-width: 500px;">
							<input type='text' data-field='ebird-code' placeholder="eBird Code" style="width: 100%;" />
							<span class='input-clear-btn' title='Clear'>✕</span>
						</div>
					</td>
				</tr>
				<tr>
					<td>Species Count</td>
					<td>
						<span data-field='species-count' style="font-weight: bold; margin-left: 12px; padding: 8px 0; display: inline-block;">-</span>
					</td>
				</tr>
				<tr>
					<td class='noborder'>
						<button class='submit'>Add</button>
						<button class='delete' style='background-color: #d9534f;'>Delete</button>
					</td>
				</tr>
			</table>
		</div>
		</div>
	</div>

	<div id="crop-modal"
		style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10001; justify-content: center; align-items: center;">
		<div id="crop-center-wrapper"
			style="width: 100%; height: 100%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; background: transparent; padding: 20px;">
			<div id="crop-image-container"
				style="flex: 1; position: relative; overflow: hidden; background: #000; width: 100%;">
				<img id="crop-image" style="display: block; max-width: 100%;">
			</div>
			<div id="crop-button-bar"
				style="height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; width: 100%; flex-shrink: 0;">
				<button id="crop-cancel" style="padding: 10px 20px;">Cancel</button>
				<button id="crop-confirm" style="padding: 10px 20px;">Crop & Upload</button>
				<button id="crop-skip" style="padding: 10px 20px;">Skip Crop & Upload</button>
			</div>
		</div>
	</div>


	<div id="custom-modal-overlay">
		<div class="custom-modal-content">
			<h3 id="custom-modal-title"></h3>
			<p id="custom-modal-message"></p>
			<div class="custom-modal-buttons">
				<button id="custom-modal-cancel">Cancel</button>
				<button id="custom-modal-confirm" class="submit">OK</button>
			</div>
		</div>
	</div>

	<div id="sync-spinner" style="display: none;">
		<div class="spinner-icon" id="sync-spinner-icon"></div>
		<span class="sync-text">Saving...</span>
	</div>

	<div id="media-popup" style="display: none;">
		<div class="media-popup-overlay"></div>
		<div class="media-popup-content">
			<button class="media-popup-close" title="Close">✕</button>
			<img src="" id="media-popup-img" style="display:none;" />
			<video src="" id="media-popup-video" controls autoplay loop style="display:none;"></video>
		</div>
	</div>

	<div id="page-loader" aria-hidden="true" style="display:none">
		<div class="page-loader-overlay"></div>
		<div class="loader-content">
			<div class="loader-binoculars">
				<div class="barrel"></div>
				<div class="connector"></div>
				<div class="barrel"></div>
			</div>
			<div class="loader-text"></div>
		</div>
	</div>
</body>

</html>
